<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 宠物</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Microsoft YaHei", sans-serif;
      background: #f6f7fb;
      color: #20253a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    .pet-panel {
      width: min(92vw, 430px);
      padding: 22px;
      border: 1px solid #dfe2ef;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgb(42 48 82 / 14%);
      text-align: center;
    }

    .pet-stage {
      display: grid;
      place-items: center;
      min-height: 360px;
      overflow: hidden;
      border-radius: 18px;
      background: #ffffff;
    }

    .pet {
      display: block;
      width: 360px;
      height: 360px;
      max-width: 100%;
      object-fit: contain;
      image-rendering: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .status {
      min-height: 1.5em;
      margin: 14px 0;
      color: #6c7187;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button {
      min-height: 40px;
      border: 1px solid #d9dced;
      border-radius: 12px;
      background: #fafaff;
      color: #30364f;
      cursor: pointer;
      font: inherit;
    }

    button:hover,
    button:focus-visible {
      border-color: #ed89ae;
      background: #fff4f8;
      outline: none;
    }

    button[aria-pressed="true"] {
      border-color: #ed89ae;
      background: #ffe8f1;
      color: #8d3557;
    }
  </style>
</head>
<body>
  <main class="pet-panel" aria-label="Codex 宠物">
    <div class="pet-stage">
      <img
        id="pet"
        class="pet"
        src="01.gif"
        alt="Codex 宠物"
        width="360"
        height="360"
        draggable="false"
      >
    </div>

    <p id="status" class="status" aria-live="polite">动作 1 / 6</p>

    <nav class="controls" aria-label="切换宠物动作">
      <button type="button" data-index="0" aria-pressed="true">动作 1</button>
      <button type="button" data-index="1" aria-pressed="false">动作 2</button>
      <button type="button" data-index="2" aria-pressed="false">动作 3</button>
      <button type="button" data-index="3" aria-pressed="false">动作 4</button>
      <button type="button" data-index="4" aria-pressed="false">动作 5</button>
      <button type="button" data-index="5" aria-pressed="false">动作 6</button>
    </nav>
  </main>

  <script>
    const sources = ["01.gif", "02.gif", "03.gif", "04.gif", "05.gif", "06.gif"];
    const pet = document.querySelector("#pet");
    const status = document.querySelector("#status");
    const buttons = [...document.querySelectorAll("[data-index]")];
    let current = 0;

    function show(index) {
      current = (index + sources.length) % sources.length;
      pet.src = sources[current];
      status.textContent = `动作 ${current + 1} / ${sources.length}`;

      buttons.forEach((button, buttonIndex) => {
        button.setAttribute("aria-pressed", String(buttonIndex === current));
      });
    }

    pet.addEventListener("click", () => show(current + 1));

    buttons.forEach((button) => {
      button.addEventListener("click", () => show(Number(button.dataset.index)));
    });

    sources.slice(1).forEach((source) => {
      const image = new Image();
      image.src = source;
    });
  </script>
</body>
</html>
